name: release-builds

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-builds-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  macos:
    runs-on: macos-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: bash test/macos_helper/helper_self_test.sh
      - run: flutter build macos --release
      - run: bash scripts/package_releases.sh
      - uses: actions/upload-artifact@v4
        with:
          name: sdwan-verge-macos
          path: dist/releases/sdwan-verge-macos-release.dmg

  ios:
    runs-on: macos-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - run: bash scripts/package_releases.sh
      - uses: actions/upload-artifact@v4
        with:
          name: sdwan-verge-ios-unsigned
          path: dist/releases/sdwan-verge-ios-release-unsigned.ipa

  android:
    runs-on: ubuntu-24.04
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: flutter build apk --release --target-platform android-arm64
      - run: bash scripts/package_releases.sh
      - uses: actions/upload-artifact@v4
        with:
          name: sdwan-verge-android
          path: dist/releases/sdwan-verge-android-arm64-release.apk

  linux:
    runs-on: ubuntu-24.04
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: flutter build linux --release
      - run: bash scripts/package_releases.sh
      - uses: actions/upload-artifact@v4
        with:
          name: sdwan-verge-linux
          path: dist/releases/sdwan-verge-linux-x64-release.tar.gz

  windows:
    runs-on: windows-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: flutter build windows --release
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/releases | Out-Null
          choco install innosetup --no-progress -y
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $env:SDWAN_SOURCE_DIR = (Resolve-Path "build/windows/x64/runner/Release").Path
          $env:SDWAN_OUTPUT_DIR = (Resolve-Path "dist/releases").Path
          $env:SDWAN_APP_VERSION = $version
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "windows\installer\sdwan-verge.iss"
      - uses: actions/upload-artifact@v4
        with:
          name: sdwan-verge-windows
          path: dist/releases/sdwan-verge-windows-x64-setup.exe

  web:
    runs-on: ubuntu-24.04
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: flutter build web
      - run: bash scripts/package_releases.sh
      - uses: actions/upload-artifact@v4
        with:
          name: sdwan-verge-web
          path: dist/releases/sdwan-verge-web-release.zip

  release:
    runs-on: ubuntu-24.04
    needs: [macos, ios, android, linux, windows, web]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist/artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/artifacts/**/sdwan-verge-*
