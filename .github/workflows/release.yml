name: release-builds

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-builds-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  macos:
    runs-on: macos-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: bash test/macos_helper/helper_self_test.sh
      - run: flutter build macos --release
      - run: bash scripts/package_releases.sh
      - uses: actions/upload-artifact@v4
        with:
          name: sdwan-verge-macos
          path: dist/releases/sdwan-verge-macos-release.dmg

  ios:
    runs-on: macos-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - run: bash scripts/package_releases.sh
      - uses: actions/upload-artifact@v4
        with:
          name: sdwan-verge-ios-unsigned
          path: dist/releases/sdwan-verge-ios-release-unsigned.ipa

  android:
    runs-on: ubuntu-24.04
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: flutter build apk --release --target-platform android-arm64
      - run: bash scripts/package_releases.sh
      - uses: actions/upload-artifact@v4
        with:
          name: sdwan-verge-android
          path: dist/releases/sdwan-verge-android-arm64-release.apk

  linux:
    runs-on: ubuntu-24.04
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: flutter build linux --release
      - run: bash scripts/package_releases.sh
      - uses: actions/upload-artifact@v4
        with:
          name: sdwan-verge-linux
          path: dist/releases/sdwan-verge-linux-x64-release.tar.gz

  windows:
    runs-on: windows-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false
      - run: flutter --version
      - run: flutter pub get
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Force windows/third_party/wintun/bin/x64 | Out-Null
          New-Item -ItemType Directory -Force windows/third_party/windivert/bin/x64 | Out-Null
          New-Item -ItemType Directory -Force windows/third_party/windivert/include | Out-Null
          Invoke-WebRequest "https://www.wintun.net/builds/wintun-0.14.1.zip" -OutFile "$env:RUNNER_TEMP\wintun.zip"
          Expand-Archive "$env:RUNNER_TEMP\wintun.zip" "$env:RUNNER_TEMP\wintun" -Force
          Copy-Item "$env:RUNNER_TEMP\wintun\wintun\bin\amd64\wintun.dll" "windows\third_party\wintun\bin\x64\wintun.dll" -Force
          Invoke-WebRequest "https://github.com/basil00/WinDivert/releases/download/v2.2.2/WinDivert-2.2.2-A.zip" -OutFile "$env:RUNNER_TEMP\windivert.zip"
          Expand-Archive "$env:RUNNER_TEMP\windivert.zip" "$env:RUNNER_TEMP\windivert" -Force
          Copy-Item "$env:RUNNER_TEMP\windivert\WinDivert-2.2.2-A\include\windivert.h" "windows\third_party\windivert\include\windivert.h" -Force
          Copy-Item "$env:RUNNER_TEMP\windivert\WinDivert-2.2.2-A\x64\WinDivert.dll" "windows\third_party\windivert\bin\x64\WinDivert.dll" -Force
          Copy-Item "$env:RUNNER_TEMP\windivert\WinDivert-2.2.2-A\x64\WinDivert64.sys" "windows\third_party\windivert\bin\x64\WinDivert64.sys" -Force
      - run: flutter build windows --release
      - shell: pwsh
        run: |
          $helper = ".\build\windows\x64\runner\Release\sdwan_windows_helper.exe"
          Get-Item $helper | Format-List FullName,Length
          & $helper self-test
          $code = $LASTEXITCODE
          Write-Host "sdwan_windows_helper self-test exit code: $code"
          if ($code -ne 0) {
            exit $code
          }
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/releases | Out-Null
          choco install innosetup --no-progress -y
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}" -replace '^v', ''
          } else {
            $version = "0.1.2-dev"
          }
          $env:SDWAN_SOURCE_DIR = (Resolve-Path "build/windows/x64/runner/Release").Path
          $env:SDWAN_OUTPUT_DIR = (Resolve-Path "dist/releases").Path
          $env:SDWAN_APP_VERSION = $version
          Invoke-WebRequest "https://raw.githubusercontent.com/kira-96/Inno-Setup-Chinese-Simplified-Translation/main/ChineseSimplified.isl" -OutFile "windows\installer\ChineseSimplified.isl"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "windows\installer\sdwan-verge.iss"
      - uses: actions/upload-artifact@v4
        with:
          name: sdwan-verge-windows
          path: dist/releases/sdwan-verge-windows-x64-setup.exe

  web:
    runs-on: ubuntu-24.04
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: flutter build web
      - run: bash scripts/package_releases.sh
      - uses: actions/upload-artifact@v4
        with:
          name: sdwan-verge-web
          path: dist/releases/sdwan-verge-web-release.zip

  release:
    runs-on: ubuntu-24.04
    needs: [macos, ios, android, linux, windows, web]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist/artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/artifacts/**/sdwan-verge-*
